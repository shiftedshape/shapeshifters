<style>
/* Layout: the monitor owns the page; a narrow instrument panel sits to its right (below it on phones). */
:root {
    --ink: #0c0a14;
    --bezel: #06050b;
    --panel: #13101d;
    --line: #2a2440;
    --fg: #ddd8f2;
    --muted: #8b84a6;
    --accent: #23e6ff;
    --hot: #ff2bd6;
    --display: "VT323", ui-monospace, Menlo, monospace;
    --ui: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font: 12px/1.45 var(--ui); }
.app {
    height: 100%;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 14px;
    padding-block: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h1 { margin: 0; font: 400 34px/1 var(--display); letter-spacing: 0.06em; color: var(--fg); text-shadow: 0 0 12px color-mix(in srgb, var(--accent) 55%, transparent); }
.crumb { color: var(--muted); font-size: 11px; letter-spacing: 0.04em; }
.crumb b { color: var(--accent); font-weight: 500; }
.hint { margin-left: auto; color: var(--muted); font-size: 11px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; min-height: 0; }
.monitor.framed { background: transparent; box-shadow: none; padding: 0; border-radius: 0; }
.monitor.framed #screen { border-radius: 0; }
.monitor { background: var(--bezel); border-radius: 28px; padding: 18px; min-height: 0; box-shadow: inset 0 0 0 1px #1b1728, 0 30px 80px -40px color-mix(in srgb, var(--hot) 35%, transparent); }
#screen { width: 100%; height: 100%; border-radius: 18px; overflow: hidden; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: auto; min-height: 0; display: flex; flex-direction: column; }
.group { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.group h2 { margin: 0; font: 600 10px/1 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
button, .seg label {
    font: 500 11px/1 var(--ui); color: var(--fg); background: transparent; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; cursor: pointer; text-align: left;
}
button:hover, .seg label:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible, textarea:focus-visible, .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on { border-color: var(--accent); color: var(--accent); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
.seg label { position: relative; text-align: center; padding: 7px 4px; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg label:has(input:checked) { border-color: var(--accent); color: var(--accent); }
.row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 40px; align-items: center; gap: 10px; }
.row span:first-child { color: var(--muted); }
.row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--fg); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); border: 0; }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 0; }
.colors { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.swatch { display: grid; gap: 5px; justify-items: center; color: var(--muted); font-size: 10px; }
input[type=color] { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: none; padding: 2px; cursor: pointer; }
textarea { width: 100%; font: 16px/1.2 var(--display); color: var(--fg); background: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; letter-spacing: 0.05em; }
.check { display: flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--accent); }
.checks { display: flex; gap: 16px; flex-wrap: wrap; }
.file { display: grid; gap: 6px; color: var(--muted); }
.file input { color: var(--muted); font: 11px var(--ui); max-width: 100%; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.actions button { text-align: center; }
pre { margin: 0; padding: 10px 12px; background: var(--ink); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; font: 11px/1.5 var(--ui); color: var(--fg); max-height: 220px; }
.note { color: var(--muted); font-size: 11px; }
[data-only] { display: none; }
.app[data-scene="media"] [data-only~="media"], .app[data-scene="grid"] [data-only~="grid"], .app[data-framed="yes"] [data-only~="framed"] { display: grid; }
@media (max-width: 860px) {
    html, body { height: auto; }
    .app { height: auto; }
    main { grid-template-columns: minmax(0, 1fr); }
    .monitor { height: min(68vw, 520px); min-height: 240px; padding: 10px; border-radius: 20px; }
    .monitor.framed { height: auto; aspect-ratio: var(--frame-aspect, 1.5); min-height: 0; padding: 0; }
    #screen { border-radius: 12px; }
    .panel { overflow: visible; }
    .hint { margin-left: 0; width: 100%; }
}
</style>

            { key: 'textY', label: 'Text Y', type: 'range', min: 0, max: 1, step: 0.01 },
            { key: 'gridRows', label: 'Grid rows', type: 'range', min: 2, max: 30, step: 1, only: 'grid' },
            { type: 'checks', items: [['textBlink', 'Blink text']] },
        ] },
        { title: 'Colour', items: [{ type: 'colors', items: [['background', 'Base'], ['gridColor', 'Grid'], ['colorA', 'Glow A'], ['colorB', 'Glow B'], ['textColor', 'Text']] }] },
        { title: 'Monitor', items: [
            ['pixelScale', 'Resolution', 0.1, 1], ['curvature', 'Curvature', 0, 2], ['scanlines', 'Scanlines', 0, 1],
            ['mask', 'RGB mask', 0, 1], ['bleed', 'Colour bleed', 0, 3], ['saturation', 'Saturation', 0, 2],
            ['brightness', 'Brightness', 0.3, 2], ['bloom', 'Bloom', 0, 3], ['noise', 'Noise', 0, 2],
            ['jitter', 'Jitter', 0, 3], ['rollBar', 'Roll bar', 0, 2], ['vignette', 'Vignette', 0, 1],
        ].map(([key, label, min, max]) => ({ key, label, type: 'range', min, max, step: 0.01 })) },
        { title: 'Motion', items: [
            { key: 'speed', label: 'Speed', type: 'range', min: 0, max: 3, step: 0.01 },
            { key: 'warp', label: 'Warp', type: 'range', min: 0, max: 3, step: 0.01 },
            { type: 'checks', items: [['interactive', 'Pointer trail'], ['glitchOnClick', 'Glitch on click']] },
        ] },
    ];

    const app = document.getElementById('app');
    const panel = document.getElementById('panel');
    let state = { ...D, frameKey: 'beige', frame: FRAMES.beige.src, frameScreen: MONITOR_SCREEN };
    const monitor = document.getElementById('monitor');
    const screen = new RetroScreen(document.getElementById('screen'), state);
    const bindings = {};

    function el(tag, attrs = {}, ...kids) {
        const n = document.createElement(tag);
        for (const k in attrs) {
            if (k === 'class') n.className = attrs[k];
            else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]);
            else n.setAttribute(k, attrs[k]);
        }
        kids.flat().forEach(k => n.append(k));
        return n;
    }

    function update(patch) {
        state = { ...state, ...patch };
        if ('frameKey' in patch) {
            const f = FRAMES[patch.frameKey];
            patch = { ...patch, frame: f ? f.src : null, frameScreen: f ? f.screen : D.frameScreen };
            state = { ...state, ...patch };
            if (f) monitor.style.setProperty('--frame-aspect', f.aspect);
            delete patch.frameKey;
        }
        screen.set(patch);
        app.dataset.scene = state.scene;
        app.dataset.framed = state.frame ? 'yes' : 'no';
        monitor.classList.toggle('framed', !!state.frame);
        renderCode();
    }

    // presets
    const presetBtns = {};
    panel.append(el('div', { class: 'group' }, el('h2', {}, 'Presets'),
        el('div', { class: 'presets' }, Object.keys(PRESETS).map(name => {
            const b = el('button', { type: 'button', id: 'preset-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-'), onclick: () => applyPreset(name) }, name);
            presetBtns[name] = b;
            return b;
        }))));

    groups.forEach(g => {
        const box = el('div', { class: 'group' }, el('h2', {}, g.title));
        g.items.forEach(it => {
            let node;
            if (it.type === 'range') {
                const out = el('output', {});
                const input = el('input', { type: 'range', id: 'in-' + it.key, min: it.min, max: it.max, step: it.step, 'aria-label': it.label });
                input.addEventListener('input', () => { out.textContent = fmt(+input.value, it.step); update({ [it.key]: +input.value }); });
                bindings[it.key] = v => { input.value = v; out.textContent = fmt(v, it.step); };
                node = el('label', { class: 'row' }, el('span', {}, it.label), input, out);
            } else if (it.type === 'seg') {
                const name = 'seg-' + it.key;
                const inputs = [];
                node = el('div', { class: 'seg', role: 'radiogroup' }, it.options.map(([v, t], n) => {
                    const i = el('input', { type: 'radio', name, id: name + '-' + n, value: v });
                    i.addEventListener('change', () => update({ [it.key]: v }));
                    inputs.push(i);
                    return el('label', {}, i, el('span', {}, t));
                }));
                bindings[it.key] = v => inputs.forEach(i => { i.checked = i.value === v; });
            } else if (it.type === 'text') {
                const t = el('textarea', { id: 'in-text', rows: '2', 'aria-label': 'Screen text', spellcheck: 'false' });
                t.addEventListener('input', () => update({ text: t.value }));
                bindings.text = v => { t.value = v; };
                node = t;
            } else if (it.type === 'checks') {
                node = el('div', { class: 'checks' }, it.items.map(([k, label]) => {
                    const c = el('input', { type: 'checkbox', id: 'in-' + k });
                    c.addEventListener('change', () => update({ [k]: c.checked }));
                    bindings[k] = v => { c.checked = !!v; };
                    return el('label', { class: 'check' }, c, label);
                }));
            } else if (it.type === 'colors') {
                node = el('div', { class: 'colors' }, it.items.map(([k, label]) => {
                    const c = el('input', { type: 'color', id: 'in-' + k, 'aria-label': label });
                    c.addEventListener('input', () => update({ [k]: c.value }));
                    bindings[k] = v => { c.value = v; };
                    return el('label', { class: 'swatch' }, c, label);
                }));
            } else if (it.type === 'file') {
                const f = el('input', { type: 'file', id: 'in-media', accept: 'image/*,video/*' });
                f.addEventListener('change', () => {
                    const file = f.files && f.files[0];
                    if (!file) return;
                    const url = URL.createObjectURL(file);
                    let media = url;
                    if (file.type.startsWith('video/')) {
                        const v = document.createElement('video');
                        Object.assign(v, { muted: true, loop: true, playsInline: true, src: url });
                        v.play().catch(() => {});
                        media = v;
                    }
                    screen.set({ media });
                });
                node = el('label', { class: 'file' }, 'Image or video from your device', f);
            }
            if (it.only) node.setAttribute('data-only', it.only);
            box.append(node);
        });
        panel.append(box);
    });

    // output
    const pre = el('pre', { id: 'code' });
    const copyBtn = el('button', { type: 'button', id: 'copy', onclick: copy }, 'Copy config');
    panel.append(el('div', { class: 'group' }, el('h2', {}, 'Use it'),
        el('div', { class: 'actions' },
            el('button', { type: 'button', id: 'glitch', onclick: () => screen.pulse(1) }, 'Glitch'),
            copyBtn,
            el('button', { type: 'button', id: 'reset', onclick: () => applyPreset('Neon') }, 'Reset')),
        pre,
        el('p', { class: 'note' }, 'Paste these options into new RetroScreen(el, { … }) or match them in the Framer component\u2019s controls. Frame pictures are in the assets folder.')));

    function fmt(v, step) { return step >= 1 ? String(Math.round(v)) : (+v).toFixed(2); }

    function diff() {
        const out = {};
        for (const k in state) {
            if (k === 'media') continue;
            if (k === 'frameKey') continue;
            if (k === 'frame') { const f = FRAMES[state.frameKey]; if (f) out.frame = f.file; continue; }
            if (k === 'frameScreen') { if (state.frame) out.frameScreen = state.frameScreen; continue; }
            if (state[k] !== D[k]) out[k] = state[k];
        }
        return out;
    }

    function renderCode() {
        const d = diff();
        const body = Object.keys(d).map(k => `    ${k}: ${typeof d[k] === 'number' ? +d[k].toFixed(3) : JSON.stringify(d[k])},`).join('\n');
        pre.textContent = `new RetroScreen(el, {\n${body || '    // defaults'}\n})`;
    }

    function copy() {
        const text = pre.textContent;
        const done = () => { copyBtn.textContent = 'Copied'; setTimeout(() => { copyBtn.textContent = 'Copy config'; }, 1400); };
        try {
            navigator.clipboard.writeText(text).then(done, () => selectCode());
        } catch (e) { selectCode(); }
    }
    function selectCode() {
        const r = document.createRange();
        r.selectNodeContents(pre);
        const s = getSelection();
        s.removeAllRanges();
        s.addRange(r);
        copyBtn.textContent = 'Press Ctrl/⌘ C';
    }

    function applyPreset(name) {
        const next = { ...D, ...PRESETS[name] };
        FRAME_KEYS.forEach(k => { next[k] = state[k]; });
        Object.values(presetBtns).forEach(b => b.classList.remove('on'));
        presetBtns[name].classList.add('on');
        for (const k in bindings) bindings[k](next[k]);
        const patch = { ...next };
        delete patch.media;
        update(patch);
    }

    applyPreset('Neon');
    if (document.fonts) document.fonts.ready.then(() => screen.set({ fontFamily: state.fontFamily }));
})();
</script>

</body>
</html>
