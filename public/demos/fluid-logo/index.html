<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluid Logo · playground · Shapeshifters</title>
<meta name="description" content="Type, an SVG or a PNG logo that smears into a four-colour fluid trail under the pointer. Try every setting.">
<link rel="canonical" href="https://shapeshifters.supply/demos/fluid-logo/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
  :root { --bg: #0b0b0d; --panel: #141417; --line: #26262b; --fg: #f4f2ee; --muted: #8d8d95; --lime: #c8f532; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 300px; height: 100%; }
  .stage { position: relative; min-height: 360px; }
  #fx { position: absolute; inset: 0; cursor: crosshair; }
  .top { position: absolute; left: 18px; top: 16px; z-index: 2; display: flex; gap: 12px; align-items: baseline; }
  .top a { color: var(--fg); text-decoration: none; font-weight: 700; }
  .top span { color: var(--muted); }
  .panel { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 14px 16px 24px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
  h2:first-child { margin-top: 0; }
  .row { display: grid; grid-template-columns: 90px minmax(0, 1fr) 40px; gap: 8px; align-items: center; margin: 7px 0; }
  .row.wide { grid-template-columns: 90px minmax(0, 1fr); }
  label { color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--lime); }
  output { font: 12px ui-monospace, Menlo, monospace; text-align: right; color: var(--muted); }
  textarea, select { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  textarea { resize: vertical; min-height: 52px; }
  .seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 2px; }
  .seg button { flex: 1; background: none; border: 0; color: var(--fg); padding: 5px 4px; border-radius: 5px; cursor: pointer; font: inherit; }
  .seg button.on { background: var(--lime); color: #151515; font-weight: 600; }
  .cols { display: flex; gap: 6px; }
  input[type=color] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
  .file { display: block; text-align: center; border: 1px dashed var(--line); border-radius: 6px; padding: 8px; cursor: pointer; color: var(--muted); }
  .file input { display: none; }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  .btns button { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 8px; cursor: pointer; font: inherit; }
  .btns button.main { background: var(--lime); color: #151515; border-color: var(--lime); font-weight: 600; }
  pre { white-space: pre-wrap; word-break: break-all; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 11px/1.5 ui-monospace, Menlo, monospace; color: var(--muted); max-height: 180px; overflow: auto; }
  [hidden] { display: none !important; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; } .panel { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage">
    <div class="top"><a href="/products/fluid-logo/">Fluid Logo</a><span>move over it · click for a burst</span></div>
    <div id="fx"></div>
  </section>
  <aside class="panel" aria-label="Settings">
    <h2>Source</h2>
    <div class="row wide"><label>Show</label><div class="seg" data-key="source"><button data-v="text" class="on">Type</button><button data-v="svg">SVG logo</button><button data-v="file">Your file</button></div></div>
    <div data-when="text">
      <div class="row wide"><label for="text">Text</label><textarea id="text">shifted
shape</textarea></div>
      <div class="row wide"><label for="font">Font</label><select id="font">
        <option value="Inter, ui-sans-serif, system-ui, sans-serif|800">Inter Extra Bold</option>
        <option value="Inter, ui-sans-serif, system-ui, sans-serif|900">Inter Black</option>
        <option value="'Space Grotesk', ui-sans-serif, sans-serif|700">Space Grotesk Bold</option>
        <option value="'Instrument Serif', Georgia, serif|400|italic">Instrument Serif Italic</option>
        <option value="'IBM Plex Mono', ui-monospace, monospace|700">IBM Plex Mono Bold</option>
      </select></div>
      <div class="row"><label for="letterSpacing">Tracking</label><input type="range" id="letterSpacing" min="-0.12" max="0.2" step="0.005" value="-0.045"><output></output></div>
      <div class="row"><label for="lineHeight">Line height</label><input type="range" id="lineHeight" min="0.7" max="1.4" step="0.01" value="0.92"><output></output></div>
      <div class="row wide"><label>Lines</label><div class="seg" data-key="textAlign"><button data-v="left" class="on">Left</button><button data-v="center">Centre</button><button data-v="right">Right</button></div></div>
      <div class="row wide"><label for="color">Colour</label><div class="cols"><input type="color" id="color" value="#f4f2ee"></div></div>
    </div>
    <div data-when="file" hidden>
      <label class="file">Choose an SVG, PNG or WebP<input type="file" id="file" accept="image/svg+xml,image/png,image/webp,image/jpeg"></label>
    </div>

    <h2>Effect</h2>
    <div class="row wide"><label>Trail colours</label><div class="cols"><input type="color" id="c0" value="#3d7bff"><input type="color" id="c1" value="#ff3ea5"><input type="color" id="c2" value="#ffb23d"><input type="color" id="c3" value="#3dffc8"></div></div>
    <div class="row"><label for="strength">Strength</label><input type="range" id="strength" min="0" max="3" step="0.05" value="1"><output></output></div>
    <div class="row"><label for="distortion">Distortion</label><input type="range" id="distortion" min="0" max="0.4" step="0.01" value="0.15"><output></output></div>
    <div class="row"><label for="brush">Brush</label><input type="range" id="brush" min="0.03" max="0.3" step="0.01" value="0.11"><output></output></div>
    <div class="row"><label for="halo">Halo</label><input type="range" id="halo" min="0" max="1" step="0.01" value="0.12"><output></output></div>
    <div class="row"><label for="cycle">Colour cycle</label><input type="range" id="cycle" min="0" max="1" step="0.01" value="0.12"><output></output></div>
    <div class="row"><label for="tint">Tint</label><input type="range" id="tint" min="0" max="1.5" step="0.05" value="1"><output></output></div>

    <h2>Layout</h2>
    <div class="row"><label for="padding">Padding</label><input type="range" id="padding" min="0" max="0.35" step="0.01" value="0.1"><output></output></div>
    <div class="row wide"><label>Align</label><div class="seg" data-key="align"><button data-v="left">Left</button><button data-v="center" class="on">Centre</button><button data-v="right">Right</button></div></div>
    <div class="row wide"><label for="bg">Background</label><div class="cols"><input type="color" id="bg" value="#0b0b0d"></div></div>

    <div class="btns"><button type="button" class="main" id="copy">Copy options</button><button type="button" id="reset">Reset</button></div>
    <pre id="code" aria-live="polite"></pre>
  </aside>
</div>
<script type="module">
  import { FluidLogo, FLUID_LOGO_DEFAULTS as D } from './fluid-logo.js';
  const $ = (id) => document.getElementById(id);
  const state = { source: 'text', fileUrl: null };
  const fx = new FluidLogo($('fx'), { text: $('text').value, padding: 0.1 });

  const nums = ['letterSpacing', 'lineHeight', 'strength', 'distortion', 'brush', 'halo', 'cycle', 'tint', 'padding'];
  const segs = {};
  document.querySelectorAll('.seg').forEach((s) => {
    segs[s.dataset.key] = s.querySelector('.on').dataset.v;
    s.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      s.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
      segs[s.dataset.key] = b.dataset.v;
      apply();
    });
  });
  const opts = () => {
    const [fam, w, style] = $('font').value.split('|');
    const o = {
      colors: ['c0', 'c1', 'c2', 'c3'].map((k) => $(k).value),
      textAlign: segs.textAlign, align: segs.align,
    };
    nums.forEach((k) => (o[k] = +$(k).value));
    if (segs.source === 'text') Object.assign(o, { image: null, text: $('text').value, fontFamily: fam, fontWeight: +w, fontStyle: style || 'normal', color: $('color').value });
    else if (segs.source === 'svg') o.image = './logo.svg';
    else o.image = state.fileUrl || './logo.svg';
    return o;
  };
  function apply() {
    document.querySelectorAll('[data-when]').forEach((el) => (el.hidden = el.dataset.when !== segs.source));
    $('stage').style.background = $('bg').value;
    nums.forEach((k) => ($(k).nextElementSibling.textContent = (+$(k).value).toFixed(2)));
    const o = opts();
    fx.set(o);
    const out = {};
    for (const k in o) if (JSON.stringify(o[k]) !== JSON.stringify(D[k])) out[k] = o[k];
    if (segs.source !== 'text') { delete out.text; delete out.fontFamily; delete out.fontWeight; delete out.fontStyle; delete out.color; out.image = segs.source === 'svg' ? 'logo.svg' : 'your-logo.svg'; }
    $('code').textContent = `new FluidLogo(el, ${JSON.stringify(out, null, 2)})`;
  }
  document.querySelectorAll('.panel input, .panel textarea, .panel select').forEach((i) => i.addEventListener('input', apply));
  $('file').addEventListener('change', (e) => {
    const f = e.target.files[0]; if (!f) return;
    if (state.fileUrl) URL.revokeObjectURL(state.fileUrl);
    state.fileUrl = URL.createObjectURL(f);
    apply();
  });
  $('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('code').textContent); $('copy').textContent = 'Copied'; setTimeout(() => ($('copy').textContent = 'Copy options'), 1400); } catch (e) {}
  });
  $('reset').addEventListener('click', () => location.reload());
  apply();
</script>
</body>
</html>
