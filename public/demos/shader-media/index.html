<title>Shader Media Playground</title>
<style>
/* Layout: Framer-like — canvas on the left, properties panel on the right; stacks on phones */
:root{--bg:#eceef2;--surface:#ffffff;--fg:#16181d;--muted:#606674;--line:#dcdfe6;--accent:#3b4ef0;--on:#ffffff;
 --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101114;--surface:#1a1c21;--fg:#eceef2;--muted:#9aa0ad;--line:#2b2e36;--accent:#8290ff;--on:#0e0f14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101114;--surface:#1a1c21;--fg:#eceef2;--muted:#9aa0ad;--line:#2b2e36;--accent:#8290ff;--on:#0e0f14;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);padding-inline:16px;padding-block:20px 32px}
.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}}
.canvas{display:flex;flex-direction:column;gap:14px;min-width:0}
h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}header p,.hint{margin:.3rem 0 0;color:var(--muted);max-width:60ch}
.stage{width:min(100%,560px);aspect-ratio:4/5;max-width:100%;align-self:center}
.pad{height:70vh}
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 0;font-size:12px}
@media (max-width:820px){.panel{position:static;max-height:none}}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 10px;border-bottom:1px solid var(--line);font-weight:600;font-size:12px}
.panel-head button{font:inherit;background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:3px 9px;cursor:pointer}
.ctl{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:start;padding:7px 14px}
.ctl>label{color:var(--muted);padding-top:5px}
.in{display:flex;flex-direction:column;gap:4px;min-width:0}.in small{color:var(--muted);line-height:1.35}
.seg{display:flex;background:var(--bg);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;font:inherit;border:0;background:transparent;color:var(--fg);padding:5px 4px;border-radius:5px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--on)}
button:focus-visible,select:focus-visible,input:focus-visible,.file:focus-within{outline:2px solid var(--accent);outline-offset:1px}
select,input[type=text]{font:inherit;width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
.num{display:flex;gap:8px;align-items:center}.num input{flex:1;min-width:0;accent-color:var(--accent)}
output{font-family:var(--mono);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.col{display:flex;gap:8px;align-items:center}.col input{width:30px;height:24px;padding:0;border:1px solid var(--line);border-radius:5px;background:none}
.col code{font-family:var(--mono);color:var(--muted)}
.file{display:inline-block;cursor:pointer;background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:6px 8px;text-align:center}
.file input{position:absolute;opacity:0;width:1px;height:1px}
</style>
