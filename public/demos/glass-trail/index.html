/* Layout: a header, then a two-column grid of project cards that react to the pointer. */
:root { --bg: #f2f1ee; --fg: #141414; --muted: #6d6a66; --line: #d9d6d0; --accent: #141414;
  --display: "Instrument Serif", Georgia, serif; --ui: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #101010; --fg: #ecebe8; --muted: #8f8b85; --line: #2a2928; --accent: #ecebe8; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #101010; --fg: #ecebe8; --muted: #8f8b85; --line: #2a2928; --accent: #ecebe8; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 var(--ui) }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 40px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px }
header { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px; justify-content: space-between }
h1 { margin: 0; font: 400 clamp(44px, 7vw, 84px)/0.95 var(--display); letter-spacing: -0.01em }
.sub { color: var(--muted); max-width: 46ch; margin: 0 }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px }
.card { display: grid; gap: 10px; min-width: 0 }
.thumb { aspect-ratio: 3 / 2; border-radius: 6px; background: var(--line) }
.meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em }
.meta b { color: var(--fg); font-weight: 500 }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px 24px; padding: 16px; border: 1px solid var(--line); border-radius: 8px }
.controls label { display: grid; grid-template-columns: 100px minmax(0,1fr) 40px; align-items: center; gap: 10px; color: var(--muted) }
.controls output { text-align: right; color: var(--fg); font-variant-numeric: tabular-nums }
input[type=range] { width: 100%; accent-color: var(--accent) }
nav.fx-demo { margin-top: 4px }
</style>
