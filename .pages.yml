# Pages CMS configuration: https://pagescms.org
# Edit products, tutorials, tools and site settings from the browser.

media:
  input: public/images
  output: /images
  rename: safe

content:
  - name: products
    label: Products
    type: collection
    path: src/content/products
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, category, collection, free, featured]
      sort: order
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: templates
              label: Affinity templates
            - name: brushes
              label: Brushes & textures
            - name: social
              label: Social media packs
      - name: collection
        label: Collection
        type: select
        options:
          values:
            - name: none
              label: None
            - name: offset
              label: Offset
            - name: detach
              label: Detach
      - name: summary
        label: Card subtitle
        type: string
        description: 'Short line under the title on cards, e.g. "Brushes · 24 brushes"'
        required: true
      - name: excerpt
        label: Short description
        type: text
        description: One or two sentences, shown in the buy box and in search results.
        required: true
      - name: free
        label: Free pack
        type: boolean
        description: Free packs show a lime "Free" tag and a download button.
      - name: cover
        label: Cover image
        type: image
        description: Used on cards. Leave empty to show a brand placeholder.
      - name: gallery
        label: Gallery
        type: object
        list: true
        fields:
          - name: image
            label: Image
            type: image
          - name: alt
            label: Alt text
            type: string
      - name: color
        label: Placeholder colour
        type: select
        description: Only used when there is no cover image.
        options:
          values: [lime, lilac, ink, white]
      - name: motif
        label: Placeholder pattern
        type: select
        options:
          values: [dots, shapes, lines]
      - name: licenses
        label: Licenses and checkout
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: License name
            type: string
          - name: description
            label: What it covers
            type: string
          - name: price
            label: Price in EUR (0 = free)
            type: number
          - name: checkoutUrl
            label: Polar checkout link
            type: string
            description: Paste the product's checkout link from Polar. Empty shows "Checkout coming soon".
      - name: inside
        label: What's inside
        type: object
        list: true
        fields:
          - name: count
            label: Number
            type: string
          - name: label
            label: Label
            type: string
          - name: text
            label: Description
            type: string
      - name: specs
        label: Specs
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: value
            label: Value
            type: string
      - name: tutorial
        label: Tutorial
        type: reference
        options:
          collection: tutorials
          value: "{name}"
          label: "{primary}"
      - name: featured
        label: Show on homepage
        type: boolean
      - name: order
        label: Sort order
        type: number
        description: Lower numbers come first.
      - name: body
        label: Full description
        type: rich-text

  - name: tutorials
    label: Tutorials
    type: collection
    path: src/content/tutorials
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, tag, date]
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: tag
        label: Tag
        type: string
        description: e.g. Detach, Offset, Social
      - name: excerpt
        label: Short description
        type: text
      - name: date
        label: Date
        type: date
      - name: video
        label: YouTube link
        type: string
        description: Optional. Embedded above the text.
      - name: color
        label: Tag colour
        type: select
        options:
          values: [lime, lilac]
      - name: body
        label: Tutorial
        type: rich-text

  - name: tools
    label: Tools
    type: collection
    path: src/content/tools
    format: yaml
    filename: "{primary}.yml"
    view:
      primary: name
      fields: [name, category, affiliate]
      sort: order
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: category
        label: Category
        type: select
        options:
          values: [Design, Websites, Fonts, Resources, Business]
      - name: why
        label: Why we use it
        type: text
      - name: url
        label: Link (affiliate link if you have one)
        type: string
      - name: affiliate
        label: Affiliate link
        type: boolean
        description: Shows the Affiliate badge and adds rel="sponsored".
      - name: monogram
        label: Monogram
        type: string
        description: Two or three letters shown in the tile.
      - name: order
        label: Sort order
        type: number

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: name
        label: Site name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: description
        label: Description
        type: text
      - name: announcement
        label: Announcement bar
        type: object
        fields:
          - name: show
            label: Show
            type: boolean
          - name: text
            label: Text
            type: string
          - name: link
            label: Link
            type: string
      - name: discordUrl
        label: Discord invite link
        type: string
      - name: affinityUrl
        label: Affinity download link
        type: string
      - name: allAccess
        label: All-access
        type: object
        fields:
          - name: live
            label: Live
            type: boolean
          - name: checkoutUrl
            label: Polar checkout link
            type: string
      - name: plans
        label: Pricing plans
        type: object
        list: true
        fields:
          - name: name
            type: string
          - name: price
            type: string
          - name: per
            type: string
          - name: style
            type: select
            options:
              values: [white, lilac, ink]
          - name: badge
            type: string
          - name: cta
            label: Button text
            type: string
          - name: link
            label: Button link
            type: string
          - name: features
            type: string
            list: true
      - name: faq
        label: FAQ
        type: object
        list: true
        fields:
          - name: q
            label: Question
            type: string
          - name: a
            label: Answer
            type: text
