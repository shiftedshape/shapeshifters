# Pages CMS configuration: https://pagescms.org
# Edit products, tutorials, tools and site settings from the browser.

media:
  input: public/images
  output: /images
  rename: safe

content:
  - name: products
    label: Products
    type: collection
    path: src/content/products
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, category, collection, free, featured]
      sort: order
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Type
        type: select
        required: true
        description: The type also decides the section (Graphics, Templates or Web) and where it shows in the menu.
        options:
          values:
            - name: effects
              label: Graphics → Effects & scripts
            - name: textures
              label: Graphics → Textures & overlays
            - name: brushes
              label: Graphics → Brushes
            - name: icons
              label: Graphics → Icons & vectors
            - name: mockups
              label: Graphics → Mockups
            - name: social
              label: Templates → Social media
            - name: brand
              label: Templates → Brand kits
            - name: print
              label: Templates → Print & posters
            - name: presentations
              label: Templates → Presentations
            - name: webgl
              label: Web → WebGL effects
            - name: framer
              label: Web → Framer components
            - name: code
              label: Web → Webflow & code
            - name: sites
              label: Web → Website templates
      - name: tools
        label: Works with
        type: select
        description: Every tool this works in. Shown on the product and used by the "Works with" filter.
        options:
          multiple: true
          values:
            - name: affinity
              label: Affinity
            - name: canva
              label: Canva
            - name: figma
              label: Figma
            - name: framer
              label: Framer
            - name: webflow
              label: Webflow
            - name: code
              label: HTML / React
      - name: collection
        label: Collection
        type: select
        options:
          values:
            - name: none
              label: None
            - name: offset
              label: Offset
            - name: detach
              label: Detach
            - name: glass
              label: Glass
      - name: summary
        label: Card subtitle
        type: string
        description: 'Short line under the title on cards, e.g. "Brushes · 24 brushes"'
        required: true
      - name: excerpt
        label: Short description
        type: text
        description: One or two sentences, shown in the buy box and in search results.
        required: true
      - name: free
        label: Free pack
        type: boolean
        description: Free packs show a lime "Free" tag and a download button.
      - name: cover
        label: Cover image
        type: image
        description: Used on cards. Leave empty to show a brand placeholder.
      - name: coverVideo
        label: Cover video
        type: file
        description: Optional short loop (MP4 or WebM, muted, under ~4 MB). Plays on cards instead of the cover image; the cover image stays as its poster.
      - name: demoUrl
        label: Live demo URL
        type: string
        description: A page that runs the effect, e.g. https://fx.shiftedshape.com/embed/retro-screen/ or /demos/retro-screen/. Adds a "Live preview" button.
      - name: previewUrl
        label: Full preview URL
        type: string
        description: Optional. Opened by the "Open live preview" button, e.g. a playground with all settings. Leave empty to open the live demo.
      - name: demoEmbed
        label: Show the demo in the gallery
        type: boolean
        default: true
        description: Puts the live demo first in the gallery so visitors can try it on the page.
      - name: demoAspect
        label: Demo shape
        type: select
        default: "16/9"
        options:
          values: ["16/9", "3/2", "4/3", "1/1", "4/5"]
      - name: gallery
        label: Gallery
        type: object
        list: true
        fields:
          - name: image
            label: Image
            type: image
          - name: alt
            label: Alt text
            type: string
      - name: color
        label: Placeholder colour
        type: select
        description: Only used when there is no cover image.
        options:
          values: [lime, lilac, ink, white]
      - name: motif
        label: Placeholder pattern
        type: select
        options:
          values: [dots, shapes, lines]
      - name: licenses
        label: Licenses and checkout
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: License name
            type: string
          - name: description
            label: What it covers
            type: string
          - name: price
            label: Price in EUR (0 = free)
            type: number
          - name: checkoutUrl
            label: Polar checkout link
            type: string
            description: Paste the product's checkout link from Polar. Empty shows "Checkout coming soon".
      - name: inside
        label: What's inside
        type: object
        list: true
        fields:
          - name: count
            label: Number
            type: string
          - name: label
            label: Label
            type: string
          - name: text
            label: Description
            type: string
      - name: specs
        label: Specs
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: value
            label: Value
            type: string
      - name: tutorial
        label: Tutorial
        type: reference
        options:
          collection: tutorials
          value: "{name}"
          label: "{primary}"
      - name: featured
        label: Show on homepage
        type: boolean
      - name: comingSoon
        label: Coming soon
        type: boolean
        description: Shows the product with a "Soon" tag and a "Get notified" button instead of checkout.
      - name: order
        label: Sort order
        type: number
        description: Lower numbers come first.
      - name: body
        label: Full description
        type: rich-text

  - name: tutorials
    label: Tutorials
    type: collection
    path: src/content/tutorials
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, tag, date]
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: tag
        label: Tag
        type: string
        description: e.g. Detach, Offset, Social
      - name: kind
        label: Kind
        type: select
        description: Where it appears under Learn.
        options:
          values:
            - name: tutorial
              label: Tutorial
            - name: cheatsheet
              label: Cheat sheet
            - name: tip
              label: Shortcut / tip
      - name: excerpt
        label: Short description
        type: text
      - name: date
        label: Date
        type: date
      - name: video
        label: YouTube link
        type: string
        description: Optional. Embedded above the text.
      - name: color
        label: Tag colour
        type: select
        options:
          values: [lime, lilac]
      - name: body
        label: Tutorial
        type: rich-text

  - name: tools
    label: Tools
    type: collection
    path: src/content/tools
    format: yaml
    filename: "{primary}.yml"
    view:
      primary: name
      fields: [name, category, affiliate]
      sort: order
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: category
        label: Category
        type: select
        options:
          values: [Design, Websites, Fonts, Resources, Business]
      - name: why
        label: Why we use it
        type: text
      - name: url
        label: Link (affiliate link if you have one)
        type: string
      - name: affiliate
        label: Affiliate link
        type: boolean
        description: Shows the Affiliate badge and adds rel="sponsored".
      - name: monogram
        label: Monogram
        type: string
        description: Two or three letters shown in the tile.
      - name: order
        label: Sort order
        type: number

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: name
        label: Site name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: description
        label: Description
        type: text
      - name: announcement
        label: Announcement bar
        type: object
        fields:
          - name: show
            label: Show
            type: boolean
          - name: text
            label: Text
            type: string
          - name: link
            label: Link
            type: string
      - name: discordUrl
        label: Discord invite link
        type: string
      - name: affinityUrl
        label: Affinity download link
        type: string
      - name: checkoutOverlay
        label: Checkout as overlay
        type: boolean
        description: Opens Polar checkout on top of the page. Your domains must be listed in Polar under Settings → Embedding.
      - name: forms
        label: Forms
        type: object
        description: Leave both empty to keep using Netlify Forms. Fill them in before moving the site to Cloudflare.
        fields:
          - name: kitFormId
            label: Kit form ID (newsletter)
            type: string
            description: 'The number in your Kit form''s embed code, e.g. 1234567 from app.kit.com/forms/1234567/subscriptions'
          - name: web3formsKey
            label: Web3Forms access key (tool suggestions)
            type: string
            description: Free key from web3forms.com, sent to the email address that should receive suggestions.
      - name: allAccess
        label: All-access
        type: object
        fields:
          - name: live
            label: Live
            type: boolean
          - name: checkoutUrl
            label: Polar checkout link
            type: string
      - name: plans
        label: Pricing plans
        type: object
        list: true
        fields:
          - name: name
            type: string
          - name: price
            type: string
          - name: per
            type: string
          - name: style
            type: select
            options:
              values: [white, lilac, ink]
          - name: badge
            type: string
          - name: cta
            label: Button text
            type: string
          - name: link
            label: Button link
            type: string
          - name: features
            type: string
            list: true
      - name: faq
        label: FAQ
        type: object
        list: true
        fields:
          - name: q
            label: Question
            type: string
          - name: a
            label: Answer
            type: text
